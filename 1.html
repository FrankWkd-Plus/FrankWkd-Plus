<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP视频解析</title><style>:root{color-scheme:light;--bg:#f3efe7;--card:#fffdf9;--ink:#1d1a16;--muted:#746b62;--line:#e6dfd4;--accent:#c4511a;--accent-dark:#9d3d12}*{box-sizing:border-box}body,html{height:100%;margin:0}body{display:flex;flex-direction:column;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}header{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line)}h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.02em;white-space:nowrap}form{display:flex;flex:1;gap:8px;min-width:0}input{flex:1;min-width:0;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:inherit;font:inherit;font-size:14px}input:focus{outline:2px solid #f3c7b0;border-color:var(--accent)}input.invalid{border-color:var(--accent);outline:2px solid #f3c7b0}button{height:42px;padding:0 18px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:650;cursor:pointer}button:hover{background:var(--accent-dark)}button:active{transform:translateY(1px)}main{position:relative;flex:1;min-height:0;margin:14px;border-radius:16px;overflow:hidden;background:#111;box-shadow:0 10px 30px rgba(40,28,16,.08)}iframe{display:none;width:100%;height:100%;border:0;background:#000}iframe.show{display:block}.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 0,rgba(196,81,26,.16),transparent 42%),#171412;color:#f6efe6}.empty.hide{display:none}.empty strong{font-size:18px;font-weight:650}.empty span{max-width:28em;color:#cbbfb2;font-size:14px;line-height:1.7}@media (max-width:680px){header{flex-direction:column;align-items:stretch;gap:10px}main{margin:10px;border-radius:12px}}</style></head><body><header><h1>VIP视频解析</h1><form id="form"><input id="url" type="text" placeholder="粘贴视频页面地址，例如 https://v.qq.com/..." autocomplete="off" spellcheck="false"> <button type="submit">开始</button></form></header><main><div class="empty" id="empty"><strong>把链接贴到上面</strong> <span id="hint">点开始后直接播放。这个文件存到桌面，双击就能打开。</span></div><iframe id="player" title="播放器" allow="autoplay; encrypted-media; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe></main><script>let PARSE_URL="https://aibox.eu.org/?url=",form=document.getElementById("form"),input=document.getElementById("url"),player=document.getElementById("player"),empty=document.getElementById("empty"),hint=document.getElementById("hint"),saved=localStorage.getItem("parse-url");saved&&(input.value=saved),form.addEventListener("submit",t=>{t.preventDefault();let e=input.value.trim();e?(/^https?:\/\//i.test(e)||(e="https://"+e),input.value=e,input.classList.remove("invalid"),localStorage.setItem("parse-url",e),player.classList.add("show"),empty.classList.add("hide"),player.src=PARSE_URL+e):(input.classList.add("invalid"),hint.textContent="请先粘贴视频链接",input.focus())})</script></body></html>
